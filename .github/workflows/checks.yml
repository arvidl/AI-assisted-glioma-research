name: Reproducible examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group notebooks --python ${{ matrix.python }}
      - run: uv run --locked --python ${{ matrix.python }} ruff check .
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check .
      - run: uv run --locked --python ${{ matrix.python }} pytest
      - run: uv run --locked --group notebooks --python ${{ matrix.python }} python scripts/check_notebooks.py
        timeout-minutes: 15
      - run: uv run --locked --python ${{ matrix.python }} glioma-ai demo --output outputs/demo
